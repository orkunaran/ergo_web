<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5e2b97">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Giriş | Hacettepe Üniversitesi Ergoterapi Staj Takip Sistemi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        hu: {
                            purple: '#5e2b97',
                            dark: '#411b6b',
                            light: '#7d45ba'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.35s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50 text-gray-800">

    <header class="bg-hu-purple text-white shadow-md z-10 relative pt-[env(safe-area-inset-top)]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center font-bold text-lg border border-white/20 shadow-inner">
                        <i class="fa-solid fa-graduation-cap text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base sm:text-lg leading-tight">Hacettepe Üniversitesi</h1>
                        <p class="text-xs text-purple-200">Ergoterapi Staj Takip Portalı</p>
                    </div>
                </div>
                <div class="hidden sm:block text-right">
                    <span class="text-xs font-semibold bg-white/10 px-3 py-1 rounded-full border border-white/20 text-purple-100">
                        <i class="fa-solid fa-shield-halved mr-1"></i>Güvenli Oturum Portalı
                    </span>
                </div>
            </div>
        </div>
    </header>

    <div id="toastContainer" class="fixed top-20 right-4 left-4 sm:left-auto z-50 flex flex-col gap-2 pointer-events-none max-w-sm sm:w-full mx-auto"></div>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden fade-in border border-gray-100">
            <div class="p-6 sm:p-8">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-purple-50 text-hu-purple mb-3 shadow-xs border border-purple-100">
                        <i class="fa-solid fa-user-lock text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-black text-gray-900 tracking-tight">Sisteme Giriş</h2>
                    <p class="text-xs text-gray-500 mt-1">Yetkinize uygun giriş yöntemini seçiniz</p>
                </div>

                <!-- Giriş Türü Sekmeleri -->
                <div class="flex border-b border-gray-200 mb-6">
                    <button type="button" onclick="switchLoginTab('staff')" id="tabStaff" class="w-1/2 py-2.5 text-sm font-bold border-b-2 border-hu-purple text-hu-purple transition-all flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-user-tie mr-2"></i>Personel / Yönetim
                    </button>
                    <button type="button" onclick="switchLoginTab('student')" id="tabStudent" class="w-1/2 py-2.5 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-all flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-user-graduate mr-2"></i>Öğrenci
                    </button>
                </div>

                <!-- 1. Personel / Koordinatör / Süpervizör / Admin Giriş Formu -->
                <form id="staffLoginForm" onsubmit="event.preventDefault(); handleLogin('staff'); return false;" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Kullanıcı Adı veya E-posta</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                <i class="fa-solid fa-user text-gray-400 text-sm"></i>
                            </div>
                            <input type="text" id="staffEmail" required autocomplete="username" class="block w-full pl-10 pr-3 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-hu-purple focus:border-hu-purple transition-shadow" placeholder="kullanıcı adı veya e-posta">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Şifre</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
                            </div>
                            <input type="password" id="staffPassword" required autocomplete="current-password" class="block w-full pl-10 pr-3 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-hu-purple focus:border-hu-purple transition-shadow" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" id="staffSubmitBtn" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-hu-purple hover:bg-hu-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-hu-purple active:scale-95 transition-all cursor-pointer">
                        <span>Giriş Yap</span>
                    </button>
                </form>

                <!-- 2. Öğrenci Giriş Formu -->
                <form id="studentLoginForm" onsubmit="event.preventDefault(); handleLogin('student'); return false;" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Öğrenci Numarası veya Kullanıcı Adı</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                <i class="fa-solid fa-id-card text-gray-400 text-sm"></i>
                            </div>
                            <input type="text" id="studentId" required autocomplete="username" class="block w-full pl-10 pr-3 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-hu-purple focus:border-hu-purple transition-shadow" placeholder="Örn: 22000001">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Şifre</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
                            </div>
                            <input type="password" id="studentPassword" required autocomplete="current-password" class="block w-full pl-10 pr-3 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-hu-purple focus:border-hu-purple transition-shadow" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" id="studentSubmitBtn" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-hu-purple hover:bg-hu-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-hu-purple active:scale-95 transition-all cursor-pointer">
                        <span>Öğrenci Girişi Yap</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        <p>&copy; 2026 Hacettepe Üniversitesi Sağlık Bilimleri Fakültesi Ergoterapi Bölümü</p>
    </footer>

    <script>
        const API_URL = `${window.location.origin}/api`;

        function showToast(message, type = 'error') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-rose-600';
            const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';

            toast.className = `flex items-center text-white px-4 py-3 rounded-2xl shadow-xl ${bgColor} transform transition-all duration-300 translate-y-[-10px] opacity-0 pointer-events-auto text-xs font-semibold`;
            toast.innerHTML = `<i class="fa-solid ${icon} mr-2 text-base"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-[-10px]', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function switchLoginTab(tab) {
            const staffForm = document.getElementById('staffLoginForm');
            const studentForm = document.getElementById('studentLoginForm');
            const tabStaff = document.getElementById('tabStaff');
            const tabStudent = document.getElementById('tabStudent');

            if (tab === 'staff') {
                staffForm.classList.remove('hidden');
                studentForm.classList.add('hidden');
                tabStaff.classList.add('border-hu-purple', 'text-hu-purple', 'font-bold');
                tabStaff.classList.remove('border-transparent', 'text-gray-500', 'font-semibold');
                tabStudent.classList.add('border-transparent', 'text-gray-500', 'font-semibold');
                tabStudent.classList.remove('border-hu-purple', 'text-hu-purple', 'font-bold');
                document.getElementById('staffEmail').focus();
            } else {
                studentForm.classList.remove('hidden');
                staffForm.classList.add('hidden');
                tabStudent.classList.add('border-hu-purple', 'text-hu-purple', 'font-bold');
                tabStudent.classList.remove('border-transparent', 'text-gray-500', 'font-semibold');
                tabStaff.classList.add('border-transparent', 'text-gray-500', 'font-semibold');
                tabStaff.classList.remove('border-hu-purple', 'text-hu-purple', 'font-bold');
                document.getElementById('studentId').focus();
            }
        }

        async function handleLogin(type) {
            const submitBtn = type === 'staff' 
                ? document.getElementById('staffSubmitBtn') 
                : document.getElementById('studentSubmitBtn');
            
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>Giriş Yapılıyor...`;

            let payload = { loginType: type };

            if (type === 'staff') {
                payload.identifier = document.getElementById('staffEmail').value.trim();
                payload.password = document.getElementById('staffPassword').value.trim();
            } else {
                payload.identifier = document.getElementById('studentId').value.trim();
                payload.password = document.getElementById('studentPassword').value.trim();
            }

            if (!payload.identifier || !payload.password) {
                showToast('Lütfen kullanıcı adı / numara ve şifrenizi giriniz.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    const normalizedUser = {
                        ...data.user,
                        role: (data.user.role || '').toLowerCase().trim()
                    };

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('activeUser', JSON.stringify(normalizedUser));

                    showToast(`Giriş başarılı! Hoş geldiniz, ${data.user.name}`, 'success');
                    
                    setTimeout(() => {
                        const role = normalizedUser.role;
                        const email = (normalizedUser.email || '').toLowerCase().trim();

                        if (email === 'orkunaran@gmail.com' || role === 'admin' || role === 'webmaster') {
                            window.location.replace('admin.html');
                        } else if (email === 'egetmzkn@gmail.com' || role === 'coordinator') {
                            window.location.replace('coordinator.html');
                        } else if (role === 'supervisor') {
                            window.location.replace('supervisor.html');
                        } else if (role === 'student') {
                            window.location.replace('student.html');
                        } else {
                            showToast(`Tanımsız kullanıcı rolü: "${data.user.role}".`, 'error');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalText;
                        }
                    }, 350);
                } else {
                    showToast(data.message || 'Hatalı kullanıcı adı veya şifre.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            } catch (error) {
                console.error('Login Hatası:', error);
                showToast('Sunucu bağlantı hatası oluştu.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
