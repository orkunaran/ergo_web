<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Hacettepe Üniversitesi Ergoterapi Staj Sistemi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        hu: {
                            purple: '#5e2b97',
                            dark: '#411b6b',
                            light: '#7d45ba'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50 text-gray-800">

    <header class="bg-hu-purple text-white shadow-md z-10 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-graduation-cap text-2xl"></i>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">Hacettepe Üniversitesi</h1>
                        <p class="text-xs text-purple-200">Ergoterapi Dış Staj Takip Sistemi</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div id="toastContainer" class="fixed top-20 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow-xl overflow-hidden fade-in border border-gray-100">
            <div class="p-6 sm:p-8">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-purple-50 text-hu-purple mb-4 shadow-sm border border-purple-100">
                        <i class="fa-solid fa-user-lock text-3xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900">Sisteme Giriş</h2>
                    <p class="text-sm text-gray-500 mt-2">Lütfen giriş yönteminizi seçiniz</p>
                </div>

                <!-- Tab Butonları -->
                <div class="flex border-b border-gray-200 mb-6">
                    <button onclick="switchLoginTab('staff')" id="tabStaff" class="w-1/2 py-2 text-sm font-semibold border-b-2 border-hu-purple text-hu-purple transition-colors">
                        Personel / Koordinatör
                    </button>
                    <button onclick="switchLoginTab('student')" id="tabStudent" class="w-1/2 py-2 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors">
                        Öğrenci
                    </button>
                </div>

                <!-- Personel Giriş Formu -->
                <form id="staffLoginForm" onsubmit="handleLogin(event, 'staff')" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">E-posta Adresi</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-envelope text-gray-400"></i>
                            </div>
                            <input type="email" id="staffEmail" required class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-hu-purple focus:border-hu-purple transition-shadow" placeholder="ornek@hacettepe.edu.tr">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="staffPassword" required class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-hu-purple focus:border-hu-purple transition-shadow" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-hu-purple hover:bg-hu-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-hu-purple transition-colors">
                        Giriş Yap
                    </button>
                </form>

                <!-- Öğrenci Giriş Formu -->
                <form id="studentLoginForm" onsubmit="handleLogin(event, 'student')" class="space-y-5 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Öğrenci Numarası</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-id-card text-gray-400"></i>
                            </div>
                            <input type="text" id="studentId" required class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-hu-purple focus:border-hu-purple transition-shadow" placeholder="Örn: 220000">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="studentPassword" required class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-hu-purple focus:border-hu-purple transition-shadow" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-hu-purple hover:bg-hu-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-hu-purple transition-colors">
                        Öğrenci Girişi Yap
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t py-4 text-center text-sm text-gray-500 flex flex-col items-center justify-center">
        <p>&copy; 2026 Hacettepe Üniversitesi Ergoterapi Bölümü. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showToast(message, type = 'error') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';

            toast.className = `flex items-center text-white px-4 py-3 rounded shadow-lg ${bgColor} transform transition-all duration-300 translate-x-full opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} mr-2"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function switchLoginTab(tab) {
            const staffForm = document.getElementById('staffLoginForm');
            const studentForm = document.getElementById('studentLoginForm');
            const tabStaff = document.getElementById('tabStaff');
            const tabStudent = document.getElementById('tabStudent');

            if (tab === 'staff') {
                staffForm.classList.remove('hidden');
                studentForm.classList.add('hidden');
                tabStaff.classList.add('border-hu-purple', 'text-hu-purple');
                tabStaff.classList.remove('border-transparent', 'text-gray-500');
                tabStudent.classList.add('border-transparent', 'text-gray-500');
                tabStudent.classList.remove('border-hu-purple', 'text-hu-purple');
            } else {
                studentForm.classList.remove('hidden');
                staffForm.classList.add('hidden');
                tabStudent.classList.add('border-hu-purple', 'text-hu-purple');
                tabStudent.classList.remove('border-transparent', 'text-gray-500');
                tabStaff.classList.add('border-transparent', 'text-gray-500');
                tabStaff.classList.remove('border-hu-purple', 'text-hu-purple');
            }
        }

        // CANLI MYSQL İLE GÜVENLİ GİRİŞ İŞLEMİ
        async function handleLogin(event, type) {
            event.preventDefault();
            
            let payload = { loginType: type };

            if (type === 'staff') {
                payload.identifier = document.getElementById('staffEmail').value.trim();
                payload.password = document.getElementById('staffPassword').value.trim();
            } else {
                payload.identifier = document.getElementById('studentId').value.trim();
                payload.password = document.getElementById('studentPassword').value.trim();
            }

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('activeUser', JSON.stringify(data.user));

                    showToast(`Giriş başarılı! Hoş geldiniz, ${data.user.name}`, 'success');
                    
                    setTimeout(() => {
                        const role = data.user.role;
                        if (role === 'admin' || role === 'webmaster') {
                            window.location.href = 'admin.html';
                        } else if (role === 'coordinator' || role === 'academic') {
                            window.location.href = 'coordinator.html';
                        } else if (role === 'supervisor') {
                            window.location.href = 'supervisor.html';
                        } else if (role === 'student') {
                            window.location.href = 'student.html';
                        }
                    }, 800);
                } else {
                    showToast(data.message || 'Hatalı e-posta, öğrenci numarası veya şifre.');
                }
            } catch (error) {
                console.error('Login Hatası:', error);
                showToast('Sunucuya bağlanılamadı. MySQL ve backend sunucusunun açık olduğundan emin olun.');
            }
        }
    </script>
</body>
</html>
