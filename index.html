<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - Ergoterapi Staj Yönetim Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .header-logo {
            background-color: #7b2cbf;
            color: white;
            padding: 24px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            text-align: center;
        }
        .btn-primary {
            background-color: #7b2cbf;
            border-color: #7b2cbf;
        }
        .btn-primary:hover {
            background-color: #641fa0;
            border-color: #641fa0;
        }
        .demo-accounts {
            font-size: 0.85rem;
            background-color: #f1f3f5;
            border-radius: 8px;
            padding: 12px;
        }
    </style>
</head>
<body>

<div class="login-card card">
    <div class="header-logo">
        <i class="fas fa-user-graduate fa-3x mb-2"></i>
        <h4 class="fw-bold mb-0">Hacettepe Ergoterapi</h4>
        <small>Staj Yönetim Sistemi</small>
    </div>
    <div class="card-body p-4">
        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label text-secondary fw-semibold">E-Posta Adresi</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control" id="email" required placeholder="ornek@hacettepe.edu.tr">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-semibold">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Giriş Yap</button>
        </form>

        <div class="demo-accounts mt-3">
            <div class="fw-bold text-dark mb-1"><i class="fas fa-info-circle me-1"></i> Demo Hesap Bilgileri:</div>
            <div class="text-muted">
                • <strong>Webmaster:</strong> webmaster@test.com / 1234<br>
                • <strong>Admin:</strong> admin@hacettepe.edu.tr / 1234<br>
                • <strong>Akademisyen:</strong> hoca@hacettepe.edu.tr / 1234<br>
                • <strong>Süpervizör:</strong> supervizor@hastane.com / 1234<br>
                • <strong>Öğrenci:</strong> ogr@hacettepe.edu.tr / 1234
            </div>
        </div>
    </div>
</div>

<script>
    // Sistemdeki Tanımlı Kullanıcılar
    const users = [
        {
            email: "webmaster@test.com",
            password: "1234",
            role: "webmaster",
            name: "Sistem Webmaster"
        },
        {
            email: "admin@hacettepe.edu.tr",
            password: "1234",
            role: "admin",
            name: "Bölüm Yöneticisi"
        },
        {
            email: "hoca@hacettepe.edu.tr",
            password: "1234",
            role: "academic",
            name: "Doç. Dr. Akademisyen"
        },
        {
            email: "supervizor@hastane.com",
            password: "1234",
            role: "supervisor",
            name: "Uzm. Ergoterapist (Süpervizör)"
        },
        {
            email: "ogr@hacettepe.edu.tr",
            password: "1234",
            role: "student",
            name: "Ahmet Yılmaz",
            studentNo: "22010045"
        }
    ];

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('alertBox');

        const foundUser = users.find(u => u.email === email && u.password === password);

        if (foundUser) {
            localStorage.setItem('activeUser', JSON.stringify(foundUser));
            
            // Yönlendirme mantığı
            if (foundUser.role === 'webmaster') {
                window.location.href = 'admin.html'; // Webmaster varsayılan olarak Admin paneline yönlenir
            } else if (foundUser.role === 'admin') {
                window.location.href = 'admin.html';
            } else if (foundUser.role === 'academic') {
                window.location.href = 'academic.html';
            } else if (foundUser.role === 'supervisor') {
                window.location.href = 'supervisor.html';
            } else if (foundUser.role === 'student') {
                window.location.href = 'student.html';
            }
        } else {
            alertBox.textContent = "Geçersiz e-posta veya şifre!";
            alertBox.classList.remove('d-none');
        }
    });
</script>

</body>
</html>
